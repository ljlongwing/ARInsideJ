# ARInsideJ sample configuration file. See README.md for the full reference.
# Any of these can be overridden on the command line instead (see -h / README.md).

# --- Server ---
ServerName           = localhost
TCPPort              = 0
RPCPort              = 0
Username             = Demo
Password             =

# --- Application ---
TargetFolder         = DefaultOutputFolder
FileMode             = FALSE
# ObjListXML is only used when FileMode=TRUE - a genuine AR System Administrator .xml export runs
# fully offline (no server connection at all); a packed .def export still needs Server/Username set
# above even though object data comes from this file. See README.md's "File Mode" section.
ObjListXML           = FilterList.xml
BlackList            =
# Limits the run to one form + its directly-related workflow instead of the whole server.
# See README.md's "Scoped Export" section. Leave blank for a normal full run.
Scope                =
DeleteExistingFiles  = FALSE
GZCompression        = FALSE
OverlayMode          = TRUE
# Emit img/search-index.js so the header search box can jump to any object. Default TRUE;
# set FALSE on very large servers where the multi-MB index isn't wanted.
SearchIndex          = TRUE
# Also write data/*.json - a machine-readable object inventory for CI / external analysis.
JsonOutput           = FALSE
# Skip the entire run when nothing has changed since the last one (file mode: the export is
# byte-identical; server mode: no object added/modified/removed). Writes/reads .arinside-state
# in the output folder. All-or-nothing - never re-documents a subset.
IncrementalRuns      = FALSE
# Set both to two offline .xml/.def exports to run a snapshot diff instead of normal
# documentation (equivalent to --diff <DiffBaseline> <DiffCurrent>). See README's Snapshot Diff.
DiffBaseline         =
DiffCurrent          =

# Max concurrent AR System connections used to fetch objects / max concurrent local worker threads
# rendering+writing HTML pages. Set both to 1 for old fully-sequential behavior.
ReadConcurrency      = 8
WriteConcurrency     = 16

# --- Data Retrieval ---
UserForm             = User
UserQuery            = '1'!=$NULL$

GroupForm            = Group
GroupQuery           = '1'!=$NULL$

RoleForm             = Roles
RoleQuery            = '1'!=$NULL$
MaxRetrieve          = 0

# --- Layout ---
CompanyName          = yourcompanyname
CompanyUrl           = http://companyurl.com

# Notes that will display on the main page
RunNotes             =

# --- Accepted for settings.ini compatibility, but not yet wired to any behavior in this port ---
# (LoadServerInfoList/LoadUserList/LoadGroupList/LoadRoleList/UTF-8/CompactFolder/OldNaming/
# APITimeout - see README.md). Safe to leave out entirely; included here only so an existing C++
# settings.ini can be reused as-is without edits.
LoadServerInfoList   = TRUE
LoadUserList         = TRUE
LoadGroupList        = TRUE
LoadRoleList         = TRUE
UTF-8                = TRUE
CompactFolder        = FALSE
OldNaming            = FALSE
APITimeout           = 0
